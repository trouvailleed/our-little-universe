<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211d28"><title>Our Little Universe — Phone Peek</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#705b78,#1b1725 70%)}button{font:inherit;cursor:pointer}.phone{width:min(100vw,420px);height:min(100dvh,860px);min-height:620px;position:relative;overflow:hidden;background:#3a2e3f;border:7px solid #19171c;border-radius:44px;box-shadow:0 30px 90px #0008}.wall{position:absolute;inset:0;background:linear-gradient(155deg,#a66b6a 0%,#d2a18b 38%,#725d78 75%,#29263e 100%)}.wall:before{content:'✦';position:absolute;top:21%;right:15%;font-size:180px;color:#fff2;filter:blur(2px)}.wall:after{content:'☾';position:absolute;bottom:18%;left:6%;font-size:180px;color:#fff3}.status{position:absolute;top:13px;left:25px;right:25px;z-index:10;display:flex;justify-content:space-between;font-weight:700;font-size:14px;pointer-events:none}.island{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:100px;height:25px;border-radius:20px;background:#111;z-index:11}.screen{position:absolute;inset:0;z-index:2}.lock{display:flex;flex-direction:column;align-items:center;padding-top:95px;text-shadow:0 2px 10px #0003}.lock .time{font-size:80px;font-weight:200;letter-spacing:-4px}.lock .date{font-size:17px}.lock .prompt{margin-top:auto;margin-bottom:70px;background:#ffffff30;padding:12px 20px;border-radius:30px;border:1px solid #fff5}.home{padding:85px 23px 45px;display:flex;flex-direction:column}.home h1{font-size:22px;margin:0 0 4px}.home p{font-size:13px;margin:0 0 35px;opacity:.9}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:25px 12px}.app{background:none;border:0;color:white;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px}.app .ico{width:65px;height:65px;border-radius:17px;display:grid;place-items:center;font-size:30px;box-shadow:0 6px 15px #0002;background:#ffffffc9}.app:nth-child(2) .ico{background:#f8cbd0}.app:nth-child(3) .ico{background:#ffe6ad}.app:nth-child(4) .ico{background:#d6b9e8}.app:nth-child(5) .ico{background:#b7ddca}.app:nth-child(6) .ico{background:#f3a8ad}.dock{margin-top:auto;border-radius:23px;background:#ffffff35;padding:15px;text-align:center;font-size:13px}.view{background:#f9f6f7;color:#2c2530;padding:62px 19px 35px;overflow-y:auto}.bar{display:flex;align-items:center;gap:14px;margin-bottom:20px}.back{border:0;background:none;color:#a05c7c;font-size:25px}.bar h2{font-size:24px;margin:0}.panel{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 16px #4b28450d}.muted{color:#887a86;font-size:12px}.bubble{max-width:85%;padding:12px 15px;border-radius:17px;margin:12px 0;line-height:1.45;font-size:14px}.from{background:#e9e3e9;border-bottom-left-radius:4px}.to{background:#bf809e;color:white;margin-left:auto;border-bottom-right-radius:4px}.choice{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #e4bdcc;border-radius:15px;background:#fff;color:#8f486b;text-align:left}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{aspect-ratio:1;background:linear-gradient(135deg,#f7c4aa,#8b688e);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;color:#fff;font-size:35px}.photo:nth-child(2){background:linear-gradient(135deg,#8797ae,#d4b2d2)}.photo:nth-child(3){background:linear-gradient(135deg,#d9a876,#9b6a6c)}.photo:nth-child(4){background:linear-gradient(135deg,#9f8ab5,#e7bbc5)}.photo small{font-size:12px;margin-top:8px}.note{font-family:Georgia,serif;line-height:1.85;font-size:16px}.track{display:flex;align-items:center;gap:14px}.cover{height:55px;width:55px;border-radius:12px;background:linear-gradient(135deg,#9b668a,#e7bda7);display:grid;place-items:center;font-size:25px}.track button{margin-left:auto;background:#ae7894;color:white;border:0;border-radius:50%;height:37px;width:37px}.homebar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:115px;height:5px;border-radius:10px;background:#fff9;z-index:12}.view~.homebar{background:#28212c}.hidden{display:none!important}.toast{position:absolute;bottom:42px;left:10%;right:10%;background:#2b2434e8;color:white;border-radius:15px;padding:12px;text-align:center;font-size:13px;z-index:20}.progress{height:8px;background:#eedfe8;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#b57a9b;transition:width .3s}.footer{text-align:center;color:#fff9;font-size:11px;margin-top:12px}@media(max-width:450px){.phone{border:0;border-radius:0;width:100vw;height:100dvh;min-height:0}.home{padding-top:90px}} </style></head><body><main class="phone"><div class="wall"></div><div class="island"></div><div class="status"><span id="clock">9:41</span><span>●●● ᯤ ▰</span></div><section id="lock" class="screen lock"><div class="date">our little universe ✦</div><div class="time" id="bigclock">9:41</div><div style="margin-top:14px">some memories feel like home ♡</div><button class="prompt" onclick="show('home')">Tap to unlock ♡</button></section><section id="home" class="screen home hidden"><h1>Our Little Universe ☾</h1><p>A little phone full of memories with Jake.</p><div class="apps"><button class="app" onclick="openApp('chat')"><span class="ico">💬</span>Messages</button><button class="app" onclick="openApp('photos')"><span class="ico">🌷</span>Photos</button><button class="app" onclick="openApp('notes')"><span class="ico">📝</span>Notes</button><button class="app" onclick="openApp('music')"><span class="ico">🎵</span>Music</button><button class="app" onclick="openApp('calls')"><span class="ico">📞</span>Calls</button><button class="app" onclick="openApp('ending')"><span class="ico">💌</span>Ending</button></div><div class="dock">✦ Tap each app to collect six little memories ✦</div></section><section id="view" class="screen view hidden"><div class="bar"><button class="back" onclick="show('home')">‹</button><h2 id="heading"></h2></div><div id="content"></div></section><div class="homebar" onclick="show('home')"></div><div id="toast" class="toast hidden"></div></main><script>
const visited=new Set();let replied=false;let photoOpened=false;let noteOpened=false;let musicPlayed=false;let callOpened=false;let endingOpened=false;const titles={chat:'Messages 💬',photos:'Photos 🌷',notes:'Notes 📝',music:'Music 🎵',calls:'Calls 📞',ending:'Our Ending 💌'};
function show(id){document.querySelectorAll('.screen').forEach(el=>el.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function visit(id){visited.add(id)}
function openApp(id){show('view');document.getElementById('heading').textContent=titles[id];const c=document.getElementById('content');if(id!=='ending')visit(id);if(id==='chat')c.innerHTML=`<p class="muted">Jake ♡ · Today, 11:11</p><div class="bubble from">Did you get home safely? 🐶</div><div class="bubble to">Yesss, but I already miss you.</div><div class="bubble from">Look outside tonight. The moon is really pretty. It reminded me of you. 🌙</div><div class="bubble from">Promise we'll keep making little memories?</div><div id="replyArea">${replied?'<div class="bubble to">Always. In every little universe. ♡</div>':'<button class="choice" onclick="reply()">♡ Always. In every little universe.</button>'}</div>`;
if(id==='photos')c.innerHTML=`<p class="muted">4 memories saved in your heart</p><div class="photos"><button class="photo" onclick="photoClick('Our first autumn walk 🍂')">🍂<small>Autumn walk</small></button><button class="photo" onclick="photoClick('A quiet sky, just us 🌙')">🌙<small>Moonlit night</small></button><button class="photo" onclick="photoClick('Coffee tastes sweeter together ☕')">☕<small>Coffee date</small></button><button class="photo" onclick="photoClick('A thousand tiny stars ✨')">✨<small>Our stars</small></button></div><p class="muted">Placeholder illustrations — replace with your own licensed photos later.</p>`;
if(id==='notes')c.innerHTML=`<div class="panel note"><small class="muted">Pinned · Dear Jake</small><p>If I could keep one thing forever, it wouldn't be a perfect day.</p><p>It would be the little things. Your laugh, the way the sky looked, and how ordinary moments became beautiful.</p><p>Some people feel like a favorite song. You feel like home. ♡</p><button class="choice" onclick="noteClick()">♡ Save this feeling</button></div>`;
if(id==='music')c.innerHTML=`<p class="muted">A playlist for the moments we never want to forget</p>${[['🌙','Moonlight Letters','Original playlist concept'],['🍁','Golden October','Original playlist concept'],['✨','Little Universe','Original playlist concept']].map(x=>`<div class="panel track"><div class="cover">${x[0]}</div><div><b>${x[1]}</b><div class="muted">${x[2]}</div></div><button onclick="musicClick()">♡</button></div>`).join('')}<p class="muted">Prototype: tombol menyimpan kenangan, belum memutar audio berhak cipta.</p>`;
if(id==='calls')c.innerHTML=`<div class="panel"><b>Jake 🐶</b><p class="muted">Yesterday · Incoming · 23 min 14 sec</p><button class="choice" onclick="callClick()">📞 Read the last call memory</button><div id="callExtra"></div></div>`;
if(id==='ending'){endingOpened=true;const count=visited.size;c.innerHTML=`<div class="panel"><h3>Our little universe ✨</h3><p>You found ${count} of 5 memory apps.</p><div class="progress"><span style="width:${count/5*100}%"></span></div>${count===5?'<p>Every message, every photo, every quiet moment… together they became a universe.</p><p class="note">“Even if the stars change, I would still choose this little universe with you.” ♡</p><button class="choice" onclick="restart()">↻ Relive our story</button>':'<p>Explore all five memory apps, then come back to unlock your letter. 💌</p><button class="choice" onclick="show(\'home\')">Keep exploring ♡</button>'}</div>`}
}
function reply(){replied=true;document.getElementById('replyArea').innerHTML='<div class="bubble to">Always. In every little universe. ♡</div>';toast('A sweet reply saved ♡')}
function photoClick(t){photoOpened=true;toast(t)}function noteClick(){noteOpened=true;toast('A feeling worth keeping ♡')}function musicClick(){musicPlayed=true;toast('Added to your heart ♡')}function callClick(){callOpened=true;document.getElementById('callExtra').innerHTML='<p class="note">“We didn’t say anything important. We just stayed on the phone until the stars came out.”</p>'}
function restart(){visited.clear();replied=false;photoOpened=false;noteOpened=false;musicPlayed=false;callOpened=false;endingOpened=false;show('lock')}
const now=new Date();const t=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});document.getElementById('clock').textContent=t;document.getElementById('bigclock').textContent=t;
</script></body></html>
